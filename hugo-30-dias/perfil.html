<!doctype html>
<html lang="es"><head><meta charset="utf-8"><title>Perfil Hugo</title>
<style>
@font-face { font-family: Lilita; src: url(fonts/LilitaOne.ttf); }
html, body { margin: 0; background: #000; }
#stage { display: none; }
</style></head>
<body>
<svg id="p" viewBox="0 0 1080 1080" width="1080" height="1080" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="stage"><svg id="s"></svg><div id="cap"></div></div>
<script src="scene.js"></script>
<script>
// Foto de perfil: Hugo el día 0, cara centrada para el recorte redondo de TikTok
function perfil(t) {
  let s = `<defs><radialGradient id="bg" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#ffe066"/><stop offset="1" stop-color="#ff922b"/></radialGradient></defs>`;
  s += `<rect width="1080" height="1080" fill="url(#bg)"/>`;
  for (let i = 0; i < 16; i += 2) {
    const a1 = i / 16 * Math.PI * 2, a2 = (i + 1) / 16 * Math.PI * 2;
    s += `<path d="M540,520 L${540 + 1200 * Math.cos(a1)},${520 + 1200 * Math.sin(a1)} L${540 + 1200 * Math.cos(a2)},${520 + 1200 * Math.sin(a2)} Z" fill="#fff" opacity=".12"/>`;
  }
  s += place(hugo({ t, g: 0, mood: 'normal', mouth: 'open', look: 0 }), 540, 1555, 1.17);
  document.getElementById('p').innerHTML = s;
}
perfil(1.35);
</script>
</body></html>
